<li class="role-list-item">
  <div class="role-list-item__header">
    <strong>{{ post.title }}</strong>
  </div>
  <div class="role-list-item__duration">{{ post.type }}, {{ post.venue }}{% if post.location %}, {{ post.location }}{% endif %}</div>
  {% if post.content != empty %}
    <div class="role-list-item__body">
      {{ post.content }}
    </div>
  {% endif %}
</li>
